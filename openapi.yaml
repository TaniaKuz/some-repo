openapi: 3.0.3
info:
  title: Flower Shop API
  description: A simple REST API for managing flowers and orders, backed by an in-memory store.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local development server
tags:
  - name: Health
  - name: Flowers
  - name: Orders
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/flowers:
    get:
      tags: [Flowers]
      summary: List flowers
      parameters:
        - name: color
          in: query
          required: false
          schema:
            type: string
          description: Filter by flower color (case-insensitive).
        - name: inStock
          in: query
          required: false
          schema:
            type: string
            enum: ['true', 'false']
          description: When 'true', only return flowers with stock greater than 0.
      responses:
        '200':
          description: A list of flowers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Flower'
    post:
      tags: [Flowers]
      summary: Create a flower
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowerInput'
      responses:
        '201':
          description: Flower created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flower'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/flowers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Flowers]
      summary: Get a flower by id
      responses:
        '200':
          description: The flower
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flower'
        '404':
          description: Flower not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Flowers]
      summary: Update a flower (partial body accepted)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowerUpdate'
      responses:
        '200':
          description: The updated flower
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flower'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Flower not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Flowers]
      summary: Delete a flower
      responses:
        '204':
          description: Flower deleted
        '404':
          description: Flower not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/orders:
    get:
      tags: [Orders]
      summary: List orders
      responses:
        '200':
          description: A list of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      tags: [Orders]
      summary: Place an order
      description: >
        Validates that each item references an existing flower with enough stock.
        On success, decrements stock, computes the total from current prices, and
        creates a confirmed order. All-or-nothing: if any item is invalid, no stock
        changes and no order is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: Order placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Validation error or insufficient stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Orders]
      summary: Get an order by id
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/orders/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Orders]
      summary: Cancel an order and restock flowers
      responses:
        '200':
          description: The cancelled order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Order already cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Flower:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
          nullable: true
        priceCents:
          type: integer
          minimum: 0
        stock:
          type: integer
          minimum: 0
      required: [id, name, priceCents, stock]
    FlowerInput:
      type: object
      properties:
        name:
          type: string
        color:
          type: string
          nullable: true
        priceCents:
          type: integer
          minimum: 0
        stock:
          type: integer
          minimum: 0
      required: [name, priceCents, stock]
    FlowerUpdate:
      type: object
      description: Partial update; any subset of fields may be provided.
      properties:
        name:
          type: string
        color:
          type: string
          nullable: true
        priceCents:
          type: integer
          minimum: 0
        stock:
          type: integer
          minimum: 0
    OrderItem:
      type: object
      properties:
        flowerId:
          type: string
        quantity:
          type: integer
          minimum: 1
      required: [flowerId, quantity]
    OrderInput:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
      required: [items]
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        status:
          type: string
          enum: [pending, confirmed, cancelled]
        totalCents:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, items, status, totalCents, createdAt]
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            details:
              type: array
              items:
                type: string
          required: [message]
      required: [error]
